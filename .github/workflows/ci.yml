name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config libtiff-dev libsqlite3-dev

      - name: Cache EGM2008 grid
        uses: actions/cache@v4
        with:
          path: data/egm2008/us_nga_egm08_25.tif
          key: egm2008-4191d471eefebf24091b56dbc604353cb3b8cf8cc70e448bb9ae56a272bef17a

      - name: Fetch EGM2008 grid
        run: |
          if [ ! -f data/egm2008/us_nga_egm08_25.tif ]; then
            ./scripts/fetch-egm2008.sh
          fi

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

  cortex-m7:
    name: Cross-compile Cortex-M7
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm

      - name: Compile library for Cortex-M7
        run: |
          clang --target=arm-none-eabi -mcpu=cortex-m7 -mthumb \
            -mfpu=fpv5-d16 -mfloat-abi=hard -O2 \
            -ffunction-sections -fdata-sections -ffreestanding \
            -Iembedded/include \
            -c embedded/src/baltic_embedded.c -o /tmp/baltic_embedded_m7.o
          size /tmp/baltic_embedded_m7.o
          llvm-nm -u /tmp/baltic_embedded_m7.o

      - name: Compile grid and check .baltic_grid section
        run: |
          clang --target=arm-none-eabi -mcpu=cortex-m7 -mthumb \
            -mfpu=fpv5-d16 -mfloat-abi=hard -O2 -ffreestanding \
            -Iembedded/include \
            -c embedded/grids/egm2008_moscow_2deg.c -o /tmp/grid_m7.o
          size /tmp/grid_m7.o
          readelf -S /tmp/grid_m7.o | grep -q '\.baltic_grid'
          echo "grid section .baltic_grid present"
